name: Agent task CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-task-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-tasks:
    name: Isolated task / ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [dispatch, fleet-rules]
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv 0.13.0 from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - name: Run the task against its own emulator
        run: uv run --locked --extra test python -m scripts.agent_ci --task ${{ matrix.task }}
      - name: Preserve task results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-task-${{ matrix.task }}-${{ github.run_attempt }}
          path: .artifacts/agent-ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  isolation-proof:
    name: Cross-environment isolation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv 0.13.0 from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - name: Verify conflicting writes and independent cleanup
        run: uv run --locked --extra test python -m scripts.agent_isolation
      - name: Preserve isolation results and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-isolation-${{ github.run_attempt }}
          path: .artifacts/agent-isolation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
