name: Agent task CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run_real_agents:
        description: Run three Copilot coding agents (billed to the organization; default branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-task-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-tasks:
    name: Isolated task / ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [dispatch, fleet-rules]
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install uv 0.13.0 from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - name: Run the task against its own emulator
        run: uv run --locked --extra test python -m scripts.agent_ci --task ${{ matrix.task }}
      - name: Preserve task results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-task-${{ matrix.task }}-${{ github.run_attempt }}
          path: .artifacts/agent-ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  copilot-swarm:
    name: Real Copilot worktree swarm
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_real_agents &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      copilot-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the trusted default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install uv 0.13.0 from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - name: Install GitHub Copilot CLI 1.0.103
        run: |
          npm install --global @github/copilot@1.0.103
          copilot --version
      - name: Run three real Copilot tasks and verify the integrated changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Copilot requests are billed to the organization. The org policy must allow this."
          uv run --locked --extra test python -m scripts.agent_swarm \
            --agent-command 'copilot -p "{prompt}" -s --allow-all-tools --no-ask-user --disable-builtin-mcps --no-custom-instructions --secret-env-vars=GITHUB_TOKEN --max-ai-credits 30'
      - name: Preserve real-agent patches, test results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: copilot-swarm-${{ github.run_attempt }}
          path: .artifacts/agent-swarm/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  isolation-proof:
    name: Cross-environment isolation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install uv 0.13.0 from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - name: Verify conflicting writes and independent cleanup
        run: uv run --locked --extra test python -m scripts.agent_isolation
      - name: Preserve isolation results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-isolation-${{ github.run_attempt }}
          path: .artifacts/agent-isolation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  swarm-check:
    name: Parallel worktree swarm check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install uv 0.13.0 from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - name: Run three tasks in parallel worktrees, then merge and test
        run: uv run --locked --extra test python -m scripts.agent_swarm
      - name: Preserve swarm results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-swarm-${{ github.run_attempt }}
          path: .artifacts/agent-swarm/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
