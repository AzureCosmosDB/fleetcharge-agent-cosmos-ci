name: Cosmos emulator CI

on:
  pull_request:
  push:
    branches: [main, 004-ollama-seeded-crud]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Emulator component checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install hash-verified uv from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/29ec6040-b234-4e31-b139-33dc4287b756/_packaging/3572dbf9-b5ef-433b-9137-fc4d7768e7cc/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=52c7da0fd9056d9551124777ec77de53f0df7017daf8f98a19e947b7837416ed"
      - name: Run the same local CI gate
        run: uv run --locked --extra test python -m scripts.ci --components-only
      - name: Build source and wheel distributions
        run: uv build
      - name: Publish deterministic test report
        if: always()
        run: python -m scripts.ci_report --suite emulator
      - name: Preserve test results and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: emulator-results-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  live-model:
    name: Real agent, grounded answers and CRUD
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install hash-verified uv from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/29ec6040-b234-4e31-b139-33dc4287b756/_packaging/3572dbf9-b5ef-433b-9137-fc4d7768e7cc/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=52c7da0fd9056d9551124777ec77de53f0df7017daf8f98a19e947b7837416ed"
      - name: Install locked test and local-model dependencies
        run: uv sync --locked --extra test
      - name: Install checksum-verified Ollama 0.40.6
        shell: bash
        run: |
          mkdir -p .artifacts "$RUNNER_TEMP/fleetcharge-ollama"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 300 \
            https://github.com/ollama/ollama/releases/download/v0.40.6/ollama-linux-amd64.tar.zst \
            --output "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          echo "c164ab8b1b28e2a247c29719b8e404c423c5b83ae64c3ab4e59d50c7ff7fc5e0  $RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/fleetcharge-ollama"
          echo "$RUNNER_TEMP/fleetcharge-ollama/bin" >> "$GITHUB_PATH"
          echo "OLLAMA_MODELS=$RUNNER_TEMP/fleetcharge-ollama-models" >> "$GITHUB_ENV"
      - name: Start isolated Ollama and poll readiness
        shell: bash
        run: |
          ollama serve > .artifacts/ollama-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/fleetcharge-ollama.pid"
          curl --fail --silent --show-error --retry 60 --retry-delay 1 \
            --retry-connrefused --retry-max-time 60 --max-time 2 \
            http://127.0.0.1:11434/api/version | tee .artifacts/ollama-version.json
          kill -0 "$(cat "$RUNNER_TEMP/fleetcharge-ollama.pid")"
      - name: Provision and verify Microsoft Phi-3.5
        shell: bash
        timeout-minutes: 10
        run: |
          ollama pull phi3.5:latest 2>&1 | tee .artifacts/ollama-pull.log
          python - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags", timeout=10) as response:
              models = json.load(response)["models"]
          model = next(item for item in models if item["name"] == "phi3.5:latest")
          expected = "61819fb370a3c1a9be6694869331e5f85f867a079e9271d66cb223acb81d04ba"
          if model["digest"] != expected:
              raise ValueError(f"Unexpected Microsoft Phi-3.5 digest: {model['digest']}")
          with open(".artifacts/ollama-base-model.json", "w") as output:
              json.dump(model, output, indent=2)
          PY
          ollama create fleetcharge-phi3.5 -f scripts/Ollama.modelfile
      - name: Verify actual LLM expected responses and persisted output CRUD
        run: uv run --no-sync python -m scripts.test_ollama --model fleetcharge-phi3.5:latest --review-timeout 900
      - name: Stop only the job-owned Ollama process
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/fleetcharge-ollama.pid" ]]; then
            pid="$(cat "$RUNNER_TEMP/fleetcharge-ollama.pid")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
            fi
          fi
      - name: Publish actual model responses and test report
        if: always()
        run: python -m scripts.ci_report --suite ollama
      - name: Preserve live-model results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ollama-results-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
