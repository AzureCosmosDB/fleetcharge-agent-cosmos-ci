name: Cosmos emulator CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Emulator integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install hash-verified uv from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/29ec6040-b234-4e31-b139-33dc4287b756/_packaging/3572dbf9-b5ef-433b-9137-fc4d7768e7cc/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=52c7da0fd9056d9551124777ec77de53f0df7017daf8f98a19e947b7837416ed"
      - name: Run the same local CI gate
        run: uv run --locked --extra test python -m scripts.ci
      - name: Preserve test results and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: emulator-results-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
