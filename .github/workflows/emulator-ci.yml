name: Cosmos emulator CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Emulator component checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install uv 0.13.0 from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - name: Run the same local CI gate
        run: uv run --locked --extra test python -m scripts.ci --components-only
      - name: Build source and wheel distributions
        run: uv build
      - name: Publish component test report
        if: always()
        run: python -m scripts.ci_report --suite emulator
      - name: Preserve test results and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: emulator-results-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  live-model:
    name: Real agent, grounded answers and CRUD
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install uv 0.13.0 from Microsoft
        shell: bash
        run: |
          python -m pip install --no-deps \
            "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/download/uv/0.13/uv-0.13.0-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
      - name: Install locked test and local-model dependencies
        run: uv sync --locked --extra test
      - name: Install Ollama 0.40.6
        shell: bash
        run: |
          mkdir -p .artifacts "$RUNNER_TEMP/fleetcharge-ollama"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 300 \
            https://github.com/ollama/ollama/releases/download/v0.40.6/ollama-linux-amd64.tar.zst \
            --output "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/fleetcharge-ollama"
          echo "$RUNNER_TEMP/fleetcharge-ollama/bin" >> "$GITHUB_PATH"
          echo "OLLAMA_MODELS=$RUNNER_TEMP/fleetcharge-ollama-models" >> "$GITHUB_ENV"
      - name: Start isolated Ollama and poll readiness
        shell: bash
        run: |
          ollama serve > .artifacts/ollama-server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/fleetcharge-ollama.pid"
          curl --fail --silent --show-error --retry 60 --retry-delay 1 \
            --retry-connrefused --retry-max-time 60 --max-time 2 \
            http://127.0.0.1:11434/api/version | tee .artifacts/ollama-version.json
          kill -0 "$(cat "$RUNNER_TEMP/fleetcharge-ollama.pid")"
      - name: Set up Microsoft Phi-3.5 for the available CPUs
        shell: bash
        timeout-minutes: 10
        run: |
          ollama pull phi3.5:latest 2>&1 | tee .artifacts/ollama-pull.log
          cp scripts/Ollama.modelfile "$RUNNER_TEMP/Ollama.modelfile"
          printf '\nPARAMETER num_thread %s\n' "$(nproc)" >> "$RUNNER_TEMP/Ollama.modelfile"
          ollama create fleetcharge-phi3.5 -f "$RUNNER_TEMP/Ollama.modelfile"
      - name: Verify actual LLM expected responses and persisted output CRUD
        run: uv run --no-sync python -m scripts.test_ollama --model fleetcharge-phi3.5:latest --review-timeout 900
      - name: Stop only the job-owned Ollama process
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/fleetcharge-ollama.pid" ]]; then
            pid="$(cat "$RUNNER_TEMP/fleetcharge-ollama.pid")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
            fi
          fi
      - name: Publish actual model responses and test report
        if: always()
        run: python -m scripts.ci_report --suite ollama
      - name: Preserve live-model results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ollama-results-${{ github.run_attempt }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
