[project]
name = "fleetcharge-agent-cosmos-ci"
version = "0.1.0"
description = "A real agent workload for learning Cosmos DB emulator-backed CI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.21.0",
    "azure-cosmos==4.17.1",
    "aiohttp==3.14.5",
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "agent-framework-openai==1.16.0",
    "openai==3.29.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.15.9",
    "mypy==1.19.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.uv]
constraint-dependencies = ["msgspec==0.21.1"]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "microsoft-public"
url = "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/simple/"
default = true

# Exact wheel metadata avoids missing metadata sidecars in Microsoft's feed.
# See specs/001-wave-review/research.md for verification and refresh requirements.
[[tool.uv.dependency-metadata]]
name = "openai"
version = "3.29.0"
requires-python = ">=3.10"
provides-extras = ["aiohttp", "bedrock", "datalib", "realtime", "voice-helpers"]
requires-dist = [
    "anyio<5,>=4.10.0",
    "httpx2<3,>=2.12.0",
    "jiter<1,>=0.16.0",
    "pydantic!=2.0.*,!=2.1.*,!=2.2.*,!=2.3.*,<3,>=1.10.13",
    "sniffio",
    "typing-extensions<5,>=4.14",
    "aiohttp>=3.14.3; extra == 'aiohttp'",
    "botocore<2,>=1.40.0; extra == 'bedrock'",
    "urllib3<3,>=2.7.0; extra == 'bedrock'",
    "numpy>=1; extra == 'datalib'",
    "pandas>=1.2.3; extra == 'datalib'",
    "websockets<16,>=13; extra == 'realtime'",
    "numpy>=2.0.2; extra == 'voice-helpers'",
    "sounddevice>=0.5.1; extra == 'voice-helpers'",
]

[[tool.uv.dependency-metadata]]
name = "jiter"
version = "0.17.0"
requires-python = ">=3.10"
provides-extras = []
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "mypy"
version = "1.19.1"
requires-python = ">=3.9"
provides-extras = ["dmypy", "mypyc", "python2", "reports", "install-types", "faster-cache"]
requires-dist = [
    "typing_extensions>=4.6.0",
    "mypy_extensions>=1.0.0",
    "pathspec>=0.9.0",
    'tomli>=1.1.0; python_version < "3.11"',
    'librt>=0.6.2; platform_python_implementation != "PyPy"',
    'psutil>=4.0; extra == "dmypy"',
    'setuptools>=50; extra == "mypyc"',
    'lxml; extra == "reports"',
    'pip; extra == "install-types"',
    'orjson; extra == "faster-cache"',
]

[[tool.uv.dependency-metadata]]
name = "ruff"
version = "0.15.9"
requires-python = ">=3.7"
provides-extras = []
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "msgspec"
version = "0.21.1"
requires-python = ">=3.10"
provides-extras = ["toml", "yaml"]
requires-dist = [
    'tomli; python_version < "3.11" and extra == "toml"',
    'tomli_w; extra == "toml"',
    'pyyaml; extra == "yaml"',
]

[[tool.uv.dependency-metadata]]
name = "aiohttp"
version = "3.14.5"
requires-python = ">=3.10"
provides-extras = ["speedups"]
requires-dist = [
    "aiohappyeyeballs>=2.5.0",
    "aiosignal>=1.4.0",
    'async-timeout<6.0,>=4.0; python_version < "3.11"',
    "attrs>=17.3.0",
    "frozenlist>=1.1.1",
    "multidict<8.0,>=4.5",
    "propcache>=0.2.0",
    'typing_extensions>=4.4; python_version < "3.13"',
    "yarl<2.0,>=1.25.1",
    'aiodns>=3.3.0; (sys_platform != "android" and sys_platform != "ios") and extra == "speedups"',
    'Brotli>=1.2; (platform_python_implementation == "CPython" and sys_platform != "android" and sys_platform != "ios") and extra == "speedups"',
    'brotlicffi>=1.2; platform_python_implementation != "CPython" and extra == "speedups"',
    'backports.zstd; (platform_python_implementation == "CPython" and python_version < "3.14" and sys_platform != "android" and sys_platform != "ios") and extra == "speedups"',
]

[[tool.uv.dependency-metadata]]
name = "regex"
version = "2026.9.29"
requires-python = ">=3.10"
provides-extras = []
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "propcache"
version = "0.5.4"
requires-python = ">=3.10"
provides-extras = []
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "multidict"
version = "7.1.0"
requires-python = ">=3.10"
provides-extras = []
requires-dist = ['typing-extensions>=4.1.0; python_version < "3.11"']

[[tool.uv.dependency-metadata]]
name = "yarl"
version = "1.25.1"
requires-python = ">=3.10"
provides-extras = []
requires-dist = ["idna>=2.0", "multidict>=4.0", "propcache>=0.2.1"]

[[tool.uv.dependency-metadata]]
name = "librt"
version = "0.16.0"
requires-python = ">=3.9"
provides-extras = []
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "pydantic_core"
version = "2.50.1"
requires-python = ">=3.10"
provides-extras = []
requires-dist = ["typing-extensions>=4.16.0"]

[[tool.uv.dependency-metadata]]
name = "charset-normalizer"
version = "3.5.2"
requires-python = ">=3.7"
provides-extras = ["unicode-backport"]
requires-dist = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = ["azure.cosmos.*", "openai", "openai.*"]
ignore_missing_imports = true
